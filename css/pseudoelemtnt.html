<!DOCTYPE html>
<html lang="pl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        p::after{
        content:"- Remember this";
        }
    </style>
</head>
<body>
    <h1>Pseundoelement <b>::after</b> formatuje treść
    za selektorem</h1>
    <p>My name is Donald</p>
    <p>I live in Duckburg</p>
</body>
</html>
